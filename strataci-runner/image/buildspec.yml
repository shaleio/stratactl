version: 0.2

# StrataCI runner buildspec.
#
# Runs inside the ephemeral CodeBuild build launched by `stratactl`. The job spec
# (STRATA_ACTION, STRATA_MODULE, artifact ref, state backend, table names, ...) is
# injected as environment-variable overrides at StartBuild time — see
# strata/runner/main.py for the contract.
#
# Works on a standard CodeBuild image (installs tofu + the strata package), or on
# a prebaked ECR image (see image/Dockerfile) where both already exist.

phases:
  install:
    commands:
      # OpenTofu (skip if the image already has it)
      - |
        if ! command -v tofu >/dev/null 2>&1; then
          TOFU_VERSION="${TOFU_VERSION:-1.8.5}"
          curl -sSL "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip" -o /tmp/tofu.zip
          unzip -o /tmp/tofu.zip -d /usr/local/bin tofu
          tofu version
        fi
      # strata package (skip if prebaked). STRATA_PKG may be an s3:// wheel or a
      # pip requirement spec; default assumes it is already importable.
      - |
        if ! python3 -c "import strata" >/dev/null 2>&1; then
          if [ -z "${STRATA_PKG}" ]; then
            echo "strata package not found and STRATA_PKG not set" >&2
            exit 2
          fi
          case "${STRATA_PKG}" in
            s3://*)
              # keep the real wheel filename — pip rejects a renamed wheel
              WHL="/tmp/$(basename "${STRATA_PKG}")"
              aws s3 cp "${STRATA_PKG}" "${WHL}"
              pip install "${WHL}[runner]"
              ;;
            *) pip install "${STRATA_PKG}" ;;
          esac
        fi
      # cryptography for offline bundle-signature verification (skip if present)
      - |
        if ! python3 -c "import cryptography" >/dev/null 2>&1; then
          pip install "cryptography>=42"
        fi
  build:
    commands:
      - python3 -m strata.runner
