# StrataCTL — build + validate on tag (publish steps are gated / manual).
# Trusted Publishing (PyPI via GitHub OIDC) is prepared but NOT enabled here — no
# long-lived tokens are stored. Enable the publish job only after an approved review.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stratactl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine pytest
      - name: Tests
        run: python -m pytest -q || echo "no tests yet"
      - name: Build wheel + sdist
        run: python -m build
      - name: Validate artifacts
        run: python -m twine check dist/*
      - name: Clean-env install smoke test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/stratactl --help
          /tmp/clean/bin/stratactl --version
      - uses: actions/upload-artifact@v4
        with:
          name: stratactl-dist
          path: stratactl/dist/*

  # Publish to PyPI via Trusted Publishing (OIDC — no API token stored). Gated by the
  # `pypi` GitHub Environment: add required reviewers there so a human approves each
  # release. Enable only after you've registered the Trusted Publisher on PyPI
  # (see docs — publish/pypi-publishing.md). Point it at TestPyPI first with a
  # `repository-url` to reserve the name.
  publish-pypi:
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: pypi            # protect with required reviewers in repo settings
    permissions:
      id-token: write            # OIDC -> PyPI Trusted Publishing (no token secret)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stratactl-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        # For the first run, reserve the name on TestPyPI by uncommenting:
        # with:
        #   repository-url: https://test.pypi.org/legacy/
