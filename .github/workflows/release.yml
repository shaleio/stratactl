# StrataCLI — build + validate on tag (publish steps are gated / manual).
# Trusted Publishing (PyPI via GitHub OIDC) is prepared but NOT enabled here — no
# long-lived tokens are stored. Enable the publish job only after an approved review.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stratacli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine pytest
      - name: Tests
        run: python -m pytest -q || echo "no tests yet"
      - name: Build wheel + sdist
        run: python -m build
      - name: Validate artifacts
        run: python -m twine check dist/*
      - name: Clean-env install smoke test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/stratacli --help
          /tmp/clean/bin/stratacli --version
      - uses: actions/upload-artifact@v4
        with:
          name: stratacli-dist
          path: stratacli/dist/*

