[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-cli"
version = "0.1.0"
description = "StrataCLI — install/update/uninstall StrataBI modules into a customer AWS account via an ephemeral CodeBuild runner."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Shaleio LLC" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "boto3>=1.34",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Installed in the runner image/buildspec — needed for offline bundle-signature
# verification (Decision C). The CLI itself does not require it.
runner = ["cryptography>=42"]
# The installation wizard reads/writes YAML (PyYAML is a core dependency above;
# this extra is kept as an explicit, documented install target).
wizard = ["pyyaml>=6"]

[project.scripts]
stratacli = "strata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strata = ["config/defaults.toml"]
